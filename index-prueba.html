<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Resultados Quiniela — Agencia 670</title>
<link rel="icon" type="image/png" href="/quiniela-saguir/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;900&family=Oswald:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; cursor:none; }
  body.mostrar-cursor, body.mostrar-cursor * { cursor: default !important; }
  body {
    background: #1a0a00;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* PANTALLA: la columna de ÚLTIMAS CABEZAS va de arriba hasta el pie. A su derecha, una
     grilla de 2 columnas: arriba la franja del sorteo y la marca, abajo la tabla y el panel.
     Al compartir columna, la franja del sorteo mide siempre exactamente lo mismo que la
     tabla (columna N° incluida). Sin panel, la tabla ocupa las dos columnas y la marca queda
     igual arriba a la derecha, centrada (ahí la franja queda un poco más corta que la tabla). */
  .pantalla { flex:1; display:flex; overflow:hidden; min-height:0; }
  .zona-derecha {
    flex:1; min-width:0; overflow:hidden;
    display:grid;
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-rows: auto minmax(0,1fr);
  }
  /* Fondo rojo con la línea dorada de abajo, detrás de la franja del sorteo y de la marca */
  .franja-roja {
    grid-row:1; grid-column:1 / -1;
    background: linear-gradient(90deg, #8B0000, #cc0000, #8B0000);
    border-bottom: 3px solid #ffd700;
  }
  .header-sorteo { grid-row:1; grid-column:1; min-width:0; padding:2px 0 5px; }
  .header-marca {
    grid-row:1; grid-column:2;
    padding:2px 12px 5px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .col-tabla { grid-row:2; grid-column:1; min-width:0; min-height:0; }
  .col-panel { grid-row:2; grid-column:2; }
  .zona-derecha.sin-panel .col-tabla { grid-column:1 / -1; }

  .marca-box { text-align:center; } /* centrada arriba a la derecha, encima del panel */
  .marca-principal {
    font-family:'Bebas Neue', sans-serif;
    font-size:20px; letter-spacing:2px; color:#ffd700; line-height:1;
  }
  .marca-frase, .marca-agencia, .marca-ciudad {
    font-size:9px; color:#fff; letter-spacing:1px; text-transform:uppercase;
  }

  .sorteo-badge {
    --escala-franja: 1;
    /* Tamaño de cada texto de la franja (Superadmin → Visual los cambia) */
    --tam-nombre: 26px; --tam-fecha: 20px; --tam-nro: 22px; --tam-estado: 20px;
    display: grid;
    grid-template-columns: auto auto auto auto;
    align-items: center;
    justify-content: center;
    gap: calc(24px * var(--escala-franja));
    min-height: 44px; /* con letras más grandes, la franja se hace más alta */
    padding: 0 calc(20px * var(--escala-franja));
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,215,0,.40);
    border-radius: 6px;
  }
  .sorteo-badge.finalizado {
    background: linear-gradient(90deg, rgba(140,55,0,.95), rgba(210,105,0,.95), rgba(140,55,0,.95));
  }
  .sorteo-badge.sorteando {
    background: linear-gradient(90deg, rgba(0,80,0,.95), rgba(0,140,0,.90), rgba(0,80,0,.95));
  }

  /* NOMBRE SORTEO — más chico para dar espacio a números */
  .sorteo-badge-name {
    font-family: 'DM Sans', sans-serif;
    font-size: calc(var(--tam-nombre) * var(--escala-franja));
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffd700;
    line-height: 1;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .sorteo-fecha { font-size:calc(var(--tam-fecha) * var(--escala-franja)); color:#fff; white-space:nowrap; }
  .sorteo-nro {
    font-family:'Oswald',sans-serif; font-size:calc(var(--tam-nro) * var(--escala-franja)); font-weight:700;
    color:#fff; letter-spacing:2px; white-space:nowrap;
  }

  .live-label {
    font-size: calc(var(--tam-estado) * var(--escala-franja)); color: #44ff88; font-weight: 900;
    letter-spacing: 1px; white-space: nowrap;
  }
  .done-label {
    font-size: calc(var(--tam-estado) * var(--escala-franja)); color: #ffd700; font-weight: 900;
    letter-spacing: 1px; white-space: nowrap;
  }

  /* FECHA — sin hora */
  .fecha-txt {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: #ffd700;
    letter-spacing: 1px;
    line-height: 1;
  }

  /* CABEZAS */
  .col-cabezas {
    width: 240px;
    background: #0d0500;
    border-right: 2px solid #ffd700;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .cabezas-header {
    background: #ffd700; color:#000; text-align:center;
    padding:6px 4px;
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px;
    flex-shrink:0;
  }
  .cabezas-section { border-bottom:1px solid rgba(255,215,0,0.25); flex-shrink:0; }
  .cabezas-section-title {
    background: rgba(255,215,0,0.1);
    padding: 2px 10px;
    font-size: 12px; color: #ffd700;
    letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
  }
  .cabeza-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; min-height: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .cabeza-prov {
    font-size: 16px; color: rgba(255,255,255,0.65);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .cabeza-num {
    font-family: 'Oswald', sans-serif;
    font-size: 18px; font-weight: 700; color: #fff;
  }

  /* TABLA */
  .col-tabla { display:flex; flex-direction:column; overflow:hidden; }

  .provincias-header {
    display: grid;
    grid-template-columns: 70px repeat(5,1fr);
    background: #8B0000;
    border-bottom: 1px solid #ffd700;
    flex-shrink: 0;
  }
  .prov-cell {
    padding: 5px 4px; text-align: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
    color: #ffd700; border-right: 1px solid rgba(255,255,255,0.15);
  }
  .prov-cell:last-child { border-right: none; }
  /* "N°": misma letra y tamaño que los números de ubicación de abajo (.pos-label) */
  .prov-cell.label {
    color: rgba(255,255,255,0.4);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  /* NÚMEROS */
  .numeros-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .numeros-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 70px repeat(5,1fr);
  }
  .pos-col { display:flex; flex-direction:column; border-right:1px solid rgba(255,215,0,0.15); }
  .pos-label {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: rgba(255,255,255,0.45);
    border-bottom: 1px solid rgba(255,255,255,0.04); letter-spacing: 1px;
  }
  .pos-label:last-child { border-bottom: none; }

  .num-col { display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,0.07); }
  .num-col:last-child { border-right: none; }

  /* Oswald Bold — 0 oval claramente distinto del 8 redondeado */
  .num-cell {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(24px, 2.3vw, 34px);
    font-weight: 700; color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    letter-spacing: 1px;
  }
  .num-cell:last-child { border-bottom: none; }
  .num-cell.primero {
    color: #ffd700;
    font-size: clamp(24px, 2.3vw, 34px);
    font-weight: 700;
  }
  .num-cell.empty { color: rgba(255,255,255,0.2); font-size: 14px; letter-spacing: 2px; }
  .num-cell.live-num { color: #44ff88; }
  .num-cell.filler { visibility: hidden; border-bottom: none; }

  /* PANEL DE LA DERECHA — texto fijo editable desde admin (ej. "Favorito de hoy").
     Mismo estilo que la columna de "Últimas cabezas", del lado opuesto. */
  .col-panel {
    width: 340px;
    background: #0d0500;
    border-left: 2px solid #ffd700;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-titulo {
    background: #ffd700; color: #000; text-align: center;
    padding: 6px 8px;
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
    flex-shrink: 0;
  }
  /* Cada parte del panel (favorito del día arriba, número de la semana abajo) es un bloque.
     Si están las dos, se reparten el alto en partes iguales; si hay una sola, ocupa todo. */
  .panel-bloque { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .panel-bloque + .panel-bloque { border-top: 2px solid #ffd700; }
  .panel-cuerpo {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 18px;
    overflow: hidden;
    text-align: center;
  }
  .panel-contenido { width: 100%; }
  .panel-numero {
    font-family: 'Oswald', sans-serif; font-weight: 700; color: #ffd700;
    font-size: 120px; line-height: 1.1; letter-spacing: 2px;
    white-space: nowrap; overflow-wrap: break-word;
  }
  .panel-separador { width: 40%; height: 2px; background: rgba(255,215,0,0.45); margin: 22px auto; }
  .panel-descripcion {
    font-family: 'DM Sans', sans-serif; font-weight: 700; color: #fff;
    font-size: 30px; line-height: 1.25;
    white-space: pre-line; overflow-wrap: break-word;
  }
  /* POCEADA (tercera parte del panel): el día, los 10 números en 2 filas de 5 y, si se
     cargó, la línea de ganadores. Los tamaños los cambia Superadmin → Visual. */
  .poceada-fecha {
    font-family: 'DM Sans', sans-serif; font-weight: 700; color: #fff;
    font-size: 24px; letter-spacing: 1px; line-height: 1.2; white-space: nowrap;
    margin-bottom: 0.45em;
  }
  .poceada-numeros {
    display: grid; grid-template-columns: repeat(5, auto); justify-content: center;
    column-gap: 0.4em; row-gap: 0.05em;
    font-family: 'Oswald', sans-serif; font-weight: 700; color: #ffd700;
    font-size: 44px; line-height: 1.15;
  }
  .poceada-ganadores {
    font-family: 'DM Sans', sans-serif; font-weight: 700; color: #fff;
    font-size: 20px; line-height: 1.25; margin-top: 0.7em;
    white-space: pre-line; overflow-wrap: break-word;
  }

  /* FOOTER */
  .footer {
    background: #0d0500; border-top: 1px solid rgba(255,215,0,0.25);
    padding: 4px 16px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .aviso-legal {
    font-size: 11px; color: #ffd700; letter-spacing: 1px;
    font-weight: 600; text-align: center;
  }
</style>
</head>
<body>

<!-- PANTALLA -->
<div class="pantalla">
  <!-- Últimas cabezas: arranca arriba de todo -->
  <div class="col-cabezas">
    <div class="cabezas-header">ÚLTIMAS CABEZAS</div>
    <div id="cabezas-content"></div>
  </div>

  <div class="zona-derecha sin-panel" id="zona-derecha">
  <div class="franja-roja"></div>

  <!-- Franja del sorteo: mide lo mismo que la tabla de abajo -->
  <div class="header-sorteo">
    <div class="sorteo-badge" id="sorteo-badge">
      <div class="sorteo-badge-name" id="badge-name">PRIMERA</div>
      <div id="badge-fecha" class="sorteo-fecha"></div>
      <div id="badge-nsorteo" class="sorteo-nro"></div>
      <div id="badge-label" class="done-label">SORTEANDO</div>
    </div>
  </div>

  <!-- Marca: arriba a la derecha, encima del panel -->
  <div class="header-marca">
    <div class="marca-box">
      <div class="marca-principal">QUINIELA SAGUIR</div>
      <div class="marca-frase">Para Saguir Ganando</div>
    </div>
  </div>

  <div class="col-tabla">
    <div class="provincias-header">
      <div class="prov-cell label">N°</div>
      <div class="prov-cell" id="header-chaquena">CHAQUEÑA</div>
      <div class="prov-cell" id="header-ciudad">CIUDAD</div>
      <div class="prov-cell" id="header-provincia">PROVINCIA</div>
      <div class="prov-cell" id="header-corrientes">CORRIENTES</div>
      <div class="prov-cell" id="header-cordoba">CÓRDOBA</div>
    </div>
    <div class="numeros-wrap">
      <div class="numeros-grid" id="numeros-grid"></div>
    </div>
  </div>

  <!-- Panel de la derecha: oculto hasta que haya algo para mostrar -->
  <div class="col-panel" id="col-panel" style="display:none;"></div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div class="aviso-legal">
    Los resultados son de carácter informativo. No son un Extracto Oficial.
  </div>
</div>

<!-- OVERLAY DE CARTELES — tapa toda la pantalla mientras se muestra un cartel -->
<div id="carteles-overlay" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:60px;text-align:center;word-break:break-word;line-height:1.3;"></div>

<script>
// =====================
// DATOS — vacíos por defecto (se llenan desde Supabase)
// =====================
const sorteoKeys = ['previa','primera','matutina','vespertina','nocturna'];
const provKeys   = ['chaquena','ciudad','provincia','corrientes','cordoba'];

// Nombres de provincia mostrados en pantalla — se pueden personalizar por agencia desde el superadmin
let nombresProvinciaTV = { chaquena:'Chaqueña', ciudad:'Ciudad', provincia:'Provincia', corrientes:'Corrientes', cordoba:'Córdoba' };

function aplicarNombresProvinciaAlHeader() {
  provKeys.forEach(k => {
    const cel = document.getElementById(`header-${k}`);
    if (cel) cel.textContent = (nombresProvinciaTV[k] || k).toUpperCase();
  });
}
let cantidadTV = {}; // ej: { chaquena:20, corrientes:10, ... } — se completa desde configuracion_visual

function cantidadProvinciaTV(key) {
  return cantidadTV[key] || 20; // 20 = default si nunca se configuró para esta agencia
}

// Números del sorteo en pantalla, guardados por FECHA + SORTEO (ej. '2026-08-28_previa'),
// no solo por sorteo: así, si una consulta falla justo al cambiar de sorteo o de día, nunca
// se muestran los números de otro día bajo la fecha de hoy.
const cacheNumeros = {};        // { 'fecha_sorteo': { nums:{prov:[...]}, ts:{prov:[...]} } }
const cacheNumeroSorteo = {};   // { 'fecha_sorteo': '15320' }
const cacheCantidadTV = {};     // { sorteo: { chaquena:20, ... } }

function numerosVacios() {
  const v = {};
  provKeys.forEach(p => { v[p] = Array(20).fill('----'); });
  return v;
}

// cabezasParaMostrar: lista de hasta 4 sorteos anteriores (ya resueltos, saltando feriados),
// en orden cronológico (el más viejo primero, el más reciente último)
let cabezasParaMostrar = [];

// Cuál es el sorteo/fecha que REALMENTE se está mostrando ahora (después de aplicar feriados)
let slotEfectivo = { fecha: null, key: null, label: null, live: false };

// mapaSorteosActivos['2026-07-09']['previa'] = false  → construido desde configuracion_sorteos
let mapaSorteosActivos = {};

const LABELS_SORTEO = { previa:'PREVIA', primera:'PRIMERA', matutina:'MATUTINA', vespertina:'VESPERTINA', nocturna:'NOCTURNA' };

// =====================
// CONSULTA A SUPABASE — distingue "no hay datos" de "no se pudo consultar"
// =====================
// Devuelve un array (vacío si de verdad no hay nada cargado) o null si NO se pudo saber:
// por un corte de red, o porque la base respondió con un error (saturada, caída por unos
// segundos, límite de consultas). Antes, un error de la base se tomaba como "no hay
// números" y la pantalla mostraba guiones durante un ciclo entero — eso hacía aparecer y
// desaparecer los números justo en los momentos de más uso del día.
async function consultarSupabase(ruta) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${ruta}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) { console.error('Supabase respondió con error', res.status, ruta); return null; }
    const cuerpo = await res.json();
    return Array.isArray(cuerpo) ? cuerpo : null;
  } catch(e) {
    console.error('Error de red consultando', ruta, e);
    return null;
  }
}

// =====================
// RESOLUCIÓN DE FERIADOS — camina hacia atrás sorteo por sorteo hasta encontrar uno activo
// =====================

// El sorteo inmediatamente anterior en la secuencia (cruza de un día al anterior en 'previa')
function sorteoAnterior(fecha, sorteoKey) {
  const idx = sorteoKeys.indexOf(sorteoKey);
  if (idx > 0) return { fecha, sorteoKey: sorteoKeys[idx - 1] };
  const partes = fecha.split('-');
  const d = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
  d.setDate(d.getDate() - 1);
  return { fecha: fechaLocalStr(d), sorteoKey: 'nocturna' };
}

// Trae de Supabase la configuración de "fecha especial" de los últimos ~30 días
// (ventana de sobra para poder caminar hacia atrás varios feriados seguidos)
async function cargarMapaSorteosActivos(hastaFecha) {
  const partes = hastaFecha.split('-');
  const desde = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
  desde.setDate(desde.getDate() - 30);
  const desdeStr = fechaLocalStr(desde);
  const rows = await consultarSupabase(`configuracion_sorteos?fecha_especial=gte.${desdeStr}&fecha_especial=lte.${hastaFecha}&select=fecha_especial,sorteo,activo`);
  // Si no se pudo consultar, se sigue usando el mapa anterior. Antes se vaciaba primero y,
  // en un día feriado, la pantalla saltaba por un ciclo al sorteo del día como si fuera un
  // día normal (con todo en guiones) y volvía en el ciclo siguiente.
  if (rows === null) return;
  const nuevo = {};
  rows.forEach(r => {
    if (!nuevo[r.fecha_especial]) nuevo[r.fecha_especial] = {};
    nuevo[r.fecha_especial][r.sorteo] = r.activo;
  });
  mapaSorteosActivos = nuevo;
}

// ¿Ese sorteo, en esa fecha, está activo? Domingo es SIEMPRE inactivo (regla estructural,
// no depende de ninguna configuración). El resto depende de si hay una fila en configuracion_sorteos;
// si no hay ninguna fila para esa fecha+sorteo, se considera un día normal (activo).
function activoEn(fecha, sorteoKey) {
  const partes = fecha.split('-');
  const d = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
  if (d.getDay() === 0) return false;
  if (mapaSorteosActivos[fecha] && mapaSorteosActivos[fecha][sorteoKey] !== undefined) {
    return mapaSorteosActivos[fecha][sorteoKey];
  }
  return true;
}

// A partir del slot "natural" (el que tocaría por horario), camina hacia atrás
// hasta encontrar el último sorteo realmente activo.
function resolverSlotEfectivo(fechaNatural, sorteoKeyNatural) {
  let actual = { fecha: fechaNatural, sorteoKey: sorteoKeyNatural };
  let vueltas = 0;
  while (!activoEn(actual.fecha, actual.sorteoKey) && vueltas < 200) {
    actual = sorteoAnterior(actual.fecha, actual.sorteoKey);
    vueltas++;
  }
  return actual;
}

// Un día calendario antes (no confundir con sorteoAnterior, que además puede cambiar de sorteo)
function diaAnterior(fechaStr) {
  const partes = fechaStr.split('-');
  const d = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
  d.setDate(d.getDate() - 1);
  return fechaLocalStr(d);
}

// Para un SORTEO FIJO (ej. 'previa'), busca la última fecha en la que ya se completó,
// respecto de la fecha/sorteo que se está mostrando como "sorteo actual". Si ese sorteo
// ocurre más temprano en el día que el que está en pantalla, ya pasó HOY; si no, hay que
// ir al día anterior. Si ese día está inactivo (feriado), sigue retrocediendo día por día.
function fechaMasRecienteParaSlot(slotKey, fechaEfectiva, keyEfectivo) {
  const esAnteriorEnElDia = sorteoKeys.indexOf(slotKey) < sorteoKeys.indexOf(keyEfectivo);
  let fecha = esAnteriorEnElDia ? fechaEfectiva : diaAnterior(fechaEfectiva);
  let vueltas = 0;
  while (!activoEn(fecha, slotKey) && vueltas < 60) {
    fecha = diaAnterior(fecha);
    vueltas++;
  }
  return fecha;
}

// =====================
// LÓGICA HORARIA
// =====================
// Duración configurable (en minutos) de la leyenda SORTEANDO, por tipo de sorteo.
// Se carga desde configuracion_visual antes de calcular el slot de cada ciclo.
// 60 = default si el superadmin nunca configuró nada para esta agencia.
let duracionSorteandoMin = { previa:60, primera:60, matutina:60, vespertina:60, nocturna:60 };

// La duración de SORTEANDO, los minutos en verde y los estilos de la pantalla salen de la
// MISMA tabla — antes eran tres consultas separadas en cada ciclo; ahora es una sola
// (ver actualizarPantalla) y de esas filas se saca todo.
function aplicarFilasConfig(rows) {
  rows.forEach(r => {
    if (!r.clave) return;
    if (r.clave.startsWith('sorteando_')) {
      const sorteo = r.clave.replace('sorteando_', '');
      const minutos = parseInt(r.valor, 10);
      if (!isNaN(minutos) && duracionSorteandoMin.hasOwnProperty(sorteo)) duracionSorteandoMin[sorteo] = minutos;
    } else if (r.clave === 'verde_minutos') {
      const minutos = parseInt(r.valor, 10);
      if (!isNaN(minutos)) duracionVerdeMin = minutos;
    }
  });
  aplicarConfigVisualDesdeFilas(rows);
}

// Minutos que un número recién cargado (o corregido) se muestra en verde.
// Un solo valor para los 5 sorteos. 5 = default si nunca se configuró.
let duracionVerdeMin = 5;

// ¿Este número puntual (provincia + posición) se cargó/corrigió hace menos
// de "duracionVerdeMin" minutos? Si no hay timestamp, no se resalta.
function esNumeroRecienCargado(provKey, idx) {
  const ts = ultimaCargaTimestamps[provKey]?.[idx];
  if (!ts) return false;
  const minutosTranscurridos = (Date.now() - ts) / 60000;
  return minutosTranscurridos < duracionVerdeMin;
}

function getSorteoActual(now = new Date()) {
  const totalMin = now.getHours() * 60 + now.getMinutes();
  const d = duracionSorteandoMin;

  // Domingo: mostrar nocturna del sábado
  if (now.getDay() === 0) return { key:'nocturna', label:'NOCTURNA', live:false };
  // Lunes antes de 10:15: nocturna del sábado
  if (now.getDay() === 1 && totalMin < 10*60+15) return { key:'nocturna', label:'NOCTURNA', live:false };

  if (totalMin < 10*60+15) return { key:'nocturna',    label:'NOCTURNA',    live:false };
  if (totalMin < 12*60)    return { key:'previa',      label:'PREVIA',      live: totalMin < 10*60+15 + d.previa };
  if (totalMin < 15*60)    return { key:'primera',     label:'PRIMERA',     live: totalMin < 12*60 + d.primera };
  if (totalMin < 18*60)    return { key:'matutina',    label:'MATUTINA',    live: totalMin < 15*60 + d.matutina };
  if (totalMin < 21*60)    return { key:'vespertina',  label:'VESPERTINA',  live: totalMin < 18*60 + d.vespertina };
  return                          { key:'nocturna',    label:'NOCTURNA',    live: totalMin < 21*60 + d.nocturna };
}

  document.getElementById('badge-name').textContent = sorteo.label;

// Si una consulta falla, se sigue mostrando lo último conocido DE ESE MISMO DÍA / ESA MISMA

function ajustarTextoPanel(cuerpo, contenido, numero, descripcion, lim) {
  if (numero) {
    // El número va en un solo renglón, lo más grande que entre a lo ancho
    numero.style.whiteSpace = 'nowrap';
    let tam = lim.numMax;
    numero.style.fontSize = tam + 'px';
    while (tam > lim.numMin && numero.scrollWidth > numero.clientWidth) {
      tam -= 2;
      numero.style.fontSize = tam + 'px';
    }
    // Si ni siquiera al mínimo entra en un renglón, se deja partir en dos
    if (numero.scrollWidth > numero.clientWidth) numero.style.whiteSpace = 'normal';
  }
  if (!cuerpo.clientHeight) return; // oculto: no se puede medir el alto
  const cs = getComputedStyle(cuerpo);
  const alto = cuerpo.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  if (descripcion) {
    let tam = lim.descMax;
    descripcion.style.fontSize = tam + 'px';
    while (tam > lim.descMin && contenido.offsetHeight > alto) {
      tam -= 1;
      descripcion.style.fontSize = tam + 'px';
    }
  }
  if (numero) {
    // Si ni con la descripción al mínimo entra a lo alto, se achica también el número
    let tam = parseFloat(numero.style.fontSize) || lim.numMax;
    while (tam > lim.numMin && contenido.offsetHeight > alto) {
      tam -= 2;
      numero.style.fontSize = tam + 'px';
    }
  }
}

// =====================
// POCEADA — reglas (OJO: index.html y admin.html tienen esta MISMA copia; si se cambia una, cambiar la otra)
// =====================
// - Se sortea martes, jueves y sábado a las 21, junto con la Nocturna. Si ese día no hay
//   Nocturna (feriado cargado en Superadmin), no cuenta como sorteo.
// - Los 10 números: las dos últimas cifras de la Chaqueña desde la ubicación 1 en adelante;
//   si una ya salió, se saltea y se sigue con la próxima ubicación, hasta juntar 10 distintos.
// - Sin repetidos (o si las ubicaciones siguientes están cargadas), se arma sola. Si faltan
//   números porque la ubicación siguiente no está cargada, un empleado los completa según el
//   extracto oficial y la confirma. Si después se corrige la Chaqueña y cambia lo que se
//   confirmó, deja de verse hasta que se confirme de nuevo.
// - Se ve desde que queda armada hasta las 21 del próximo sorteo. Se muestra de menor a mayor.
const POCEADA_DIAS = [2, 4, 6];             // martes, jueves y sábado
const POCEADA_MINUTO_SORTEO = 21 * 60;      // 21:00
const POCEADA_TAM_DEFECTO = { fecha: 24, numeros: 44, ganadores: 20 };
const POCEADA_NOMBRE_DIA = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];

function poceadaParse(fecha) { const p = fecha.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function poceadaSumarDias(fecha, n) {
  const d = poceadaParse(fecha);
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// "MARTES 24/11"
function poceadaEtiquetaFecha(fecha) {
  const p = fecha.split('-');
  return `${POCEADA_NOMBRE_DIA[poceadaParse(fecha).getDay()]} ${p[2]}/${p[1]}`;
}

// El sorteo de Poceada que corresponde mostrar: el último martes/jueves/sábado con Nocturna
// cuyo horario (21 h) ya llegó. hayNocturna(fecha) dice si ese día hubo Nocturna.
function poceadaSorteoVigente(hoy, minutoAhora, hayNocturna) {
  for (let i = 0; i <= 28; i++) {
    const f = poceadaSumarDias(hoy, -i);
    if (!POCEADA_DIAS.includes(poceadaParse(f).getDay())) continue;
    if (i === 0 && minutoAhora < POCEADA_MINUTO_SORTEO) continue;
    if (!hayNocturna(f)) continue;
    return f;
  }
  return null;
}

// nums: las 20 ubicaciones de la Chaqueña ('1234', o vacío si no está cargada).
// Hacen falta las ubicaciones 1 a 10 cargadas; después se siguen usando las que estén
// cargadas una detrás de otra (11, 12...) para reemplazar los repetidos.
function poceadaCalcular(nums) {
  const ok = n => typeof n === 'string' && /^\d{4}$/.test(n);
  for (let i = 0; i < 10; i++) if (!ok(nums[i])) return { cargada: false, completa: false, base: [], faltan: 10, detalle: [] };
  const base = [], detalle = [];
  for (let i = 0; i < nums.length && base.length < 10; i++) {
    if (!ok(nums[i])) break;
    const dos = nums[i].slice(-2);
    const repetido = base.includes(dos);
    detalle.push({ pos: i + 1, numero: nums[i], dos, repetido });
    if (!repetido) base.push(dos);
  }
  return { cargada: true, completa: base.length === 10, base, faltan: 10 - base.length, detalle };
}

// Los 10 números que se ven (de menor a mayor), o null si todavía no se puede mostrar.
// fila: el renglón guardado de ese sorteo (confirmación con los faltantes), o null.
function poceadaResultado(calc, fila) {
  if (!calc || !calc.cargada) return null;
  if (calc.completa) return calc.base.slice().sort();
  if (!fila || !fila.confirmado) return null;
  const base = Array.isArray(fila.base) ? fila.base : [];
  const faltantes = Array.isArray(fila.faltantes) ? fila.faltantes : [];
  // Si se corrigió la Chaqueña después de confirmar y cambió lo que salió, hay que confirmar de nuevo
  if (base.length !== calc.base.length || base.some((n, i) => n !== calc.base[i])) return null;
  if (faltantes.length !== calc.faltan) return null;
  const todos = base.concat(faltantes);
  if (todos.some(n => !/^\d{2}$/.test(n)) || new Set(todos).size !== 10) return null;
  return todos.slice().sort();
}

// Achica la fecha, los números y la línea de ganadores en la misma proporción hasta que entren
// en su parte del panel (tam = los tamaños máximos, configurados en Superadmin → Visual).
function ajustarPoceadaPanel(cuerpo, contenido, fecha, numeros, ganadores, tam) {
  if (!cuerpo || !contenido || !numeros) return;
  const aplicar = f => {
    if (fecha) fecha.style.fontSize = Math.max(8, Math.round(tam.fecha * f)) + 'px';
    numeros.style.fontSize = Math.max(10, Math.round(tam.numeros * f)) + 'px';
    if (ganadores) ganadores.style.fontSize = Math.max(8, Math.round(tam.ganadores * f)) + 'px';
  };
  let f = 1;
  aplicar(f);
  if (!cuerpo.clientHeight) return; // oculto: no se puede medir
  const cs = getComputedStyle(cuerpo);
  const alto = cuerpo.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  const noEntra = () => contenido.offsetHeight > alto || numeros.scrollWidth > numeros.clientWidth + 1
    || (fecha && fecha.scrollWidth > fecha.clientWidth + 1);
  while (f > 0.3 && noEntra()) { f -= 0.04; aplicar(f); }
}

// Estado de la Poceada en esta pantalla
let poceadaMostrar = false;                    // tilde "Mostrar la Poceada" (apagado si nunca se configuró)
let poceadaTam = { ...POCEADA_TAM_DEFECTO };   // tamaños máximos (Superadmin → Visual)
let poceadaVista = { sorteo: null, parte: null }; // lo último armado, y de qué sorteo es

// Trae lo necesario y arma la Poceada que corresponde ahora. Solo consulta si el tilde está
// prendido. Si una consulta falla, queda lo último armado DEL MISMO sorteo (nunca el anterior).
async function cargarPoceada(hoy) {
  if (!poceadaMostrar) { poceadaVista = { sorteo: null, parte: null }; return; }
  const ahora = new Date();
  const sorteo = poceadaSorteoVigente(hoy, ahora.getHours() * 60 + ahora.getMinutes(), f => activoEn(f, 'nocturna'));
  if (!sorteo) { poceadaVista = { sorteo: null, parte: null }; return; }
  const falla = () => { if (poceadaVista.sorteo !== sorteo) poceadaVista = { sorteo, parte: null }; };
  const filas = await consultarSupabase(`tablero_poceada?agencia_id=eq.${URL_AGENCIA_ENCODED}&fecha=eq.${sorteo}&select=*`);
  if (filas === null) return falla();
  const fila = filas[0] || null;
  // Si el sorteo se pasó a otro día, el empleado cargó el día y el turno de donde salen los números
  const fechaReal = (fila && fila.fecha_real) || sorteo;
  const turno = (fila && fila.sorteo_real) || 'nocturna';
  const rows = await consultarSupabase(`resultados?fecha=eq.${fechaReal}&sorteo=eq.${turno}&agencia_id=eq.${URL_AGENCIA_ENCODED}&provincia=eq.chaquena&order=posicion.asc&select=posicion,numero`);
  if (rows === null) return falla();
  const nums = Array(20).fill(null);
  rows.forEach(r => { if (r.posicion >= 1 && r.posicion <= 20) nums[r.posicion - 1] = r.numero; });
  const numeros = poceadaResultado(poceadaCalcular(nums), fila);
  poceadaVista = { sorteo, parte: numeros ? {
    tipo: 'poceada', titulo: 'POCEADA', fecha: poceadaEtiquetaFecha(fechaReal), numeros,
    ganadores: ((fila && fila.ganadores) || '').trim()
  } : null };
}
function panelPartePoceada() {
  return (poceadaMostrar && poceadaVista.parte) ? poceadaVista.parte : null;
}

// Lunes de la semana vigente para el número de la semana: de lunes a sábado, el lunes de esta
// semana; el domingo, el lunes de mañana (ya rige el de la semana que viene).
function lunesDeLaSemanaVigente(fecha) {
  const p = fecha.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  const dia = d.getDay();
  d.setDate(d.getDate() + (dia === 0 ? 1 : 1 - dia));
  return fechaLocalStr(d);
}

// ¿Ese día hay al menos un sorteo? (domingo nunca; un feriado, si los 5 sorteos están sin actividad)
function hayAlgunSorteo(fecha) {
  return sorteoKeys.some(k => activoEn(fecha, k));
}

// Lo que se muestra de cada parte (o null si esa parte no va)
function panelParteDia() {
  const d = panelDia.fila;
  if (!panelMostrarDia || !panelDia.fecha || !d || !hayAlgunSorteo(panelDia.fecha)) return null;
  const p = { titulo: (d.titulo || '').trim(), numero: (d.numero || '').trim(), descripcion: (d.descripcion || '').trim() };
  return (p.titulo || p.numero || p.descripcion) ? p : null;
}
function panelParteSemana() {
  const s = panelSemana.fila;
  if (!panelMostrarSemana || !panelSemana.lunes || !s) return null;
  const p = { titulo: (s.titulo || '').trim(), numero: (s.numero || '').trim(), descripcion: '' };
  return (p.titulo || p.numero) ? p : null;
}

function htmlBloquePanel(p) {
  if (p.tipo === 'poceada') {
    let h = '<div class="panel-bloque panel-bloque-poceada">';
    h += `<div class="panel-titulo">${escaparHtml(p.titulo)}</div>`;
    h += '<div class="panel-cuerpo"><div class="panel-contenido">';
    h += `<div class="poceada-fecha">${escaparHtml(p.fecha)}</div>`;
    h += `<div class="poceada-numeros">${p.numeros.map(n => `<span>${escaparHtml(n)}</span>`).join('')}</div>`;
    if (p.ganadores) h += `<div class="poceada-ganadores">${escaparHtml(p.ganadores)}</div>`;
    return h + '</div></div></div>';
  }
  let html = '<div class="panel-bloque">';
  if (p.titulo) html += `<div class="panel-titulo">${escaparHtml(p.titulo)}</div>`;
  html += '<div class="panel-cuerpo"><div class="panel-contenido">';
  if (p.numero) html += `<div class="panel-numero">${escaparHtml(p.numero)}</div>`;
  if (p.numero && p.descripcion) html += '<div class="panel-separador"></div>';
  if (p.descripcion) html += `<div class="panel-descripcion">${escaparHtml(p.descripcion)}</div>`;
  html += '</div></div></div>';
  return html;
}

function renderPanel() {
  const col = document.getElementById('col-panel');
  if (!col) return;
  const partes = [panelParteDia(), panelParteSemana(), panelPartePoceada()].filter(Boolean);
  const zona = document.getElementById('zona-derecha');
  if (partes.length === 0) {
    if (panelClaveMostrada !== '') { col.style.display = 'none'; col.innerHTML = ''; panelClaveMostrada = ''; }
    if (zona) zona.classList.add('sin-panel');
    ajustarFranjaSorteo();
    return;
  }
  const clave = JSON.stringify(partes);
  if (clave !== panelClaveMostrada) {
    col.innerHTML = partes.map(htmlBloquePanel).join('');
    col.style.display = 'flex';
    panelClaveMostrada = clave;
  }
  if (zona) zona.classList.remove('sin-panel');
  ajustarPanelEnPantalla();
  ajustarFranjaSorteo();
}

// La franja del sorteo mide lo mismo que la tabla. Si en una pantalla angosta (o con las
// columnas de los costados muy anchas) su texto no entra, se achica todo en la misma
// proporción. Si entra, queda en su tamaño de siempre (escala 1).
function ajustarFranjaSorteo() {
  const badge = document.getElementById('sorteo-badge');
  if (!badge) return;
  badge.style.setProperty('--escala-franja', '1');
  const disponible = badge.clientWidth;
  if (!disponible) return;
  const hijos = Array.from(badge.children);
  const cs = getComputedStyle(badge);
  const necesario = hijos.reduce((t, h) => t + h.scrollWidth, 0)
    + (parseFloat(cs.columnGap) || 0) * Math.max(0, hijos.length - 1)
    + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  if (necesario > disponible) {
    badge.style.setProperty('--escala-franja', Math.max(0.5, (disponible - 6) / necesario).toFixed(3));
  }
}

// Se vuelve a ajustar en cada ciclo (por si cambió el ancho del panel) y cuando terminan de

async function intentarMostrarBloqueCarteles() {
  if (bloqueCartelesEnCurso) return;
  if (proximaRotacionCarteles === null || Date.now() < proximaRotacionCarteles) return;

  // Se reprograma YA, se muestre o no el bloque esta vez
  programarProximaRotacionCarteles();

  if (estaSorteando()) return; // coincide con "SORTEANDO" de verdad: se saltea esta vez

  await cargarConfigCarteles(); // trae la lista más fresca posible antes de mostrarla
  if (!cartelesConfig.lista || cartelesConfig.lista.length === 0) return;

    await esperarMs((cartel.duracion_segundos || 5) * 1000);

  bloqueCartelesEnCurso = false;
}

function fechaLocalStr(d) {
  // Usa fecha LOCAL (Argentina) en lugar de UTC para evitar desfase horario
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function getFechaConsulta(now = new Date()) {
  const diaSemana = now.getDay(); // 0=domingo
  const tm = now.getHours()*60 + now.getMinutes();
  const fecha = new Date(now.getTime());

  // Domingo: mostrar nocturna del sábado
  if (diaSemana === 0) {
    fecha.setDate(fecha.getDate() - 1);
    return fechaLocalStr(fecha);
  }

  // Antes de las 10:15 cualquier día: nocturna del día anterior
  if (tm < 10*60+15) {
    fecha.setDate(fecha.getDate() - 1);
    return fechaLocalStr(fecha);
  }

  return fechaLocalStr(fecha);
}

async function init() {
  // El código de acceso se valida PRIMERO. Si todavía no se pudo consultar (sin internet
  // al prender la TV), se reintenta cada 15 segundos en vez de declararlo inválido.
  let estadoCodigo = await resolverAgenciaDesdeCodigoAcceso();
  while (estadoCodigo === 'error') {
    await esperarMs(15000);
    estadoCodigo = await resolverAgenciaDesdeCodigoAcceso();
  }
  if (estadoCodigo !== 'ok') { mostrarCodigoInvalido(); return; }

  await Promise.all([actualizarPantalla(), cargarConfigCarteles()]);
  programarProximaRotacionCarteles();

  // Cada ciclo se programa recién cuando el anterior terminó del todo (setTimeout, no
  // setInterval) — así nunca hay dos actualizaciones pisándose entre sí.
  async function cicloActualizacion() {
    try {
      await actualizarPantalla();
      await intentarMostrarBloqueCarteles();
    } catch(e) {
      console.error('Error en el ciclo de actualización:', e);
    }
    setTimeout(cicloActualizacion, 30000);
  }
  setTimeout(cicloActualizacion, 30000);
}

// =====================
// OCULTAR EL PUNTERO DEL CONTROL REMOTO (Smart TV)
// =====================
// Muchos navegadores de Smart TV ocultan solos el puntero tipo "mano" del
// control remoto cuando la página está en pantalla completa y no hay
// movimiento — por eso con el sistema anterior desaparecía solo. Acá se
// intenta entrar a pantalla completa para que ese comportamiento nativo se
// active. Como algunos navegadores exigen que sea a partir de una acción
// del usuario (un clic o botón del control), también se reintenta apenas
// se detecta la primera interacción.
function intentarPantallaCompleta() {
  const el = document.documentElement;
  const pedir = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (pedir && !document.fullscreenElement) {
    pedir.call(el).catch(() => {}); // si el navegador lo bloquea, no pasa nada — se reintenta con la próxima interacción
  }
}
intentarPantallaCompleta();
['click', 'keydown', 'pointerdown'].forEach(evento => {
  document.addEventListener(evento, intentarPantallaCompleta, { once: true });
});

// Resguardo propio, además de lo anterior: se muestra el puntero mientras
// hay movimiento, y se vuelve a ocultar a los 3 segundos de inactividad.
let temporizadorCursor = null;
function actividadDeCursorDetectada() {
  document.body.classList.add('mostrar-cursor');
  clearTimeout(temporizadorCursor);
  temporizadorCursor = setTimeout(() => {
    document.body.classList.remove('mostrar-cursor');
  }, 3000);
}
document.addEventListener('mousemove', actividadDeCursorDetectada);
document.addEventListener('pointermove', actividadDeCursorDetectada);
</script>
</body>
</html>
